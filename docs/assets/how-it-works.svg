system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f3f7ff" text-anchor="middle">Scan</text><text x="300" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a9b8d5" text-anchor="middle">Resources &amp; usage</text><path d="M554 88H646" fill="none" stroke="#4a6aa5" stroke-width="2.2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><circle cx="500" cy="88" r="42" fill="url(#brandGrad)"/><circle cx="500" cy="88" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.18"/><g transform="translate(483 71) scale(1.4166666666666667)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 4.2 2.6 17.5a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0Z"/><path d="M12 9.5v4"/><path d="M12 17h.01"/></g><circle cx="532" cy="56" r="14" fill="#f3f7ff"/><text x="532" y="61.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#2f5fb8" text-anchor="middle">3</text><text x="500" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f3f7ff" text-anchor="middle">Detect</text><text x="500" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a9b8d5" text-anchor="middle">Transparent rules</text><path d="M754 88H846" fill="none" stroke="#4a6aa5" stroke-width="2.2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><circle cx="700" cy="88" r="42" fill="url(#brandGrad)"/><circle cx="700" cy="88" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.18"/><g transform="translate(683 71) scale(1.4166666666666667)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-