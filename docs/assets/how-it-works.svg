  <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c82e3"/><stop offset="1" stop-color="#2f5fb8"/></linearGradient></defs>
<rect width="1200" height="240" rx="20" fill="url(#bg)"/>
<rect width="1200" height="240" rx="20" fill="url(#dots)"/>
